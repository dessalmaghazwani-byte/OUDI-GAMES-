<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OUDI GAMES</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ed1e5e;--teal:#72cbcf;--ink:#111;--line:#ececec;--red:#e11d2e;--yel:#facc15;--green:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:clamp(14px,4vw,28px)}
h1{font:900 26px 'Tajawal',sans-serif;margin:0;display:flex;align-items:center;gap:10px}
h1 i{width:28px;height:28px;background:var(--teal);border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:17px;transform:rotate(-8deg)}
.btn{font:800 15px 'Tajawal',sans-serif;border:2px solid var(--ink);background:var(--ink);color:#fff;padding:9px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink)}.btn.p{background:var(--pink);border-color:var(--pink)}
.btn.g{background:var(--green);border-color:var(--green)}.btn.r{background:var(--red);border-color:var(--red)}
.btn:focus-visible,.sq:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{display:grid;gap:clamp(10px,3.4vw,22px);grid-template-columns:1fr 1fr;grid-template-areas:"b r" "x x"}
.team{border:clamp(2px,.45vw,3px) solid var(--line);border-radius:clamp(18px,5.2vw,34px);padding:10px;text-align:center;aspect-ratio:1.03;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.6vw,12px)}.team .lbl:empty,#ldn:empty{display:none}
.team.b{grid-area:b}.team.r{grid-area:r}
.ic{width:clamp(54px,16vw,105px);height:clamp(54px,16vw,105px);margin:0;fill:#0a0a0a;transition:fill .25s}
.ic.red{fill:var(--red)}.ic.yel{fill:var(--yel)}
.score{font:900 clamp(40px,12.5vw,80px)/1 'Tajawal',sans-serif}
.lbl{font-size:13px;color:#666;min-height:18px}#ldn.lbl{font-size:clamp(13px,3vw,18px);font-weight:800;margin-bottom:6px}
.board{grid-area:x;display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(4px,1.4vw,9px);width:100%;margin:0 auto}
.sq{aspect-ratio:1;border:0;border-radius:clamp(6px,1.6vw,10px);background:var(--pink);color:#fff;font:900 clamp(11px,2.6vw,17px) 'Tajawal',sans-serif;cursor:pointer;padding:0;display:grid;place-items:center;transition:transform .15s}
.sq:hover:not(:disabled){transform:scale(1.08)}
.sq:disabled{cursor:default;background:#0a0a0a;color:transparent}
.sq svg{width:62%;height:62%}
dialog{border:0;border-radius:18px;padding:0;width:min(94vw,460px);max-height:96vh;overflow:auto;box-shadow:0 20px 60px #0006}#dlg{--d:min(92vw,88vh,540px);width:var(--d);height:var(--d);max-height:none;border-radius:calc(var(--d)*.06)}#dlg .m{font-size:calc(var(--d)/26);padding:1em;height:100%;display:flex;flex-direction:column;overflow:auto}#dlg .m>:first-child{margin-top:auto}#dlg .m>:last-child{margin-bottom:auto}#dlg .hd{gap:.7em;margin-bottom:.7em}#dlg .no{font-size:1.8em;min-width:1.9em;padding:.2em .3em}#dlg .ttl{font-size:1.35em}#dlg .st{font-size:1.2em}#dlg .tb{font-size:1.45em;padding:.8em .6em;margin:.4em .2em;border-width:.18em;outline-width:.18em}#dlg .big{font-size:3.2em}#dlg .pimg{width:min(100%,10em);margin:.3em auto}#dlg .tiles{grid-template-columns:repeat(3,3.4em);gap:.5em;margin:.6em 0}#dlg .tiles span{height:3.4em;font-size:2.2em}#dlg .trio{gap:.5em;margin:.6em 0}#dlg .trio span{width:26%;font-size:2.4em}#dlg .act{margin-top:.6em}#dlg .row{gap:.6em;margin-top:.4em}#dlg .stp{gap:.7em}#dlg .stp b{font-size:2em;min-width:1.6em}#dlg .stp button{width:2.4em;height:2.4em;font-size:1.4em;border-radius:.6em}#dlg .btn{font-size:1.05em;padding:.55em 1.1em;border-radius:.7em}#dlg .ans{font-size:1.6em;min-height:1.5em}#dlg .msg{min-height:1.4em}#dlg .fin{padding:.5em}#dlg .fin .big{font-size:2.2em}
dialog::backdrop{background:#000a}
.m{padding:16px;text-align:center}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.no{background:var(--pink);color:#fff;font:900 30px 'Tajawal',sans-serif;min-width:56px;padding:6px 8px;display:grid;place-items:center}
.ttl{flex:1;text-align:right;font:900 19px 'Tajawal',sans-serif}
.st{font:900 18px 'Tajawal',sans-serif;white-space:nowrap}
.hd svg{width:30px;height:30px}
.tb{color:#fff;border:3px dashed #fff;outline:3px solid var(--c);background:var(--c);padding:22px 14px;font:700 22px/1.7 'Tajawal',sans-serif;margin:8px 4px}
.tb.mir span{display:inline-block;transform:scaleX(-1)}
.big{font:900 56px/1.2 'Tajawal',sans-serif}
.pimg{width:min(100%,240px);aspect-ratio:1;border-radius:8px;display:block;margin:6px auto}
.tiles{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:12px 0}
.tiles span{height:64px;background:#dbaa7e;color:#fff;display:grid;place-items:center;font:700 38px 'Tajawal',sans-serif}
.trio{display:flex;gap:8px;justify-content:center;margin:10px 0}
.trio span{width:30%;aspect-ratio:1;background:#1b3a63;display:grid;place-items:center;font-size:44px}
.act{margin-top:12px}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.stp{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800}
.stp b{font:900 30px 'Tajawal',sans-serif;min-width:44px}
.stp button{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);background:#fff;font:900 22px 'Tajawal',sans-serif;cursor:pointer}
.msg{font-weight:800;color:var(--red);min-height:22px}
.ans{font:900 24px 'Tajawal',sans-serif;min-height:34px}
.fin{padding:26px 10px}.fin .big{font-size:34px}
#login{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center}
#login h2{font:900 40px 'Tajawal',sans-serif;margin:0}.roles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.role{width:130px;border:2px solid var(--line);border-radius:16px;padding:20px;background:#fff;cursor:pointer;font:800 17px 'Tajawal',sans-serif}
.role svg{width:76px;height:76px;display:block;margin:0 auto}.role.ld{width:100%;max-width:294px;font-size:20px}
.nl #mc button{display:none}#tm{font:900 clamp(15px,4.3vw,26px) 'Tajawal',sans-serif;color:var(--ink);text-align:center;min-height:26px;margin-bottom:clamp(12px,3vw,20px)}
.team.me{border-color:var(--pink)}#mode{font-size:13px;color:#666}
.tools{display:flex;gap:clamp(6px,2vw,13px)}.tools .btn{width:clamp(36px,9.3vw,60px);height:clamp(36px,9.3vw,60px);padding:0;border-radius:50%}.tools .bi{width:58%;height:58%;stroke-width:2.8}#out{background:var(--pink);border-color:var(--pink)}
#cd:empty{display:none}#cd{height:clamp(36px,8.5vw,55px);padding:0 clamp(8px,2.6vw,20px);border-radius:clamp(10px,2.5vw,16px);font:900 clamp(12px,2.9vw,19px) 'Tajawal',sans-serif;letter-spacing:.5px;white-space:nowrap;gap:clamp(5px,1.4vw,9px)}#cd .bi{width:1.3em;height:1.3em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.bi{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lg{width:1.15em;height:1.15em;vertical-align:-.2em;margin:0 3px}
.lead{width:100%;max-width:294px;border:2px solid var(--line);border-radius:16px;padding:12px}
.lead .lt{font:800 17px 'Tajawal',sans-serif;margin-bottom:8px}
.lead .btn{flex:1;min-width:128px}
#ldn{text-align:center;font-weight:700}
.lgo{display:block;height:auto;max-width:100%}
.hl{width:31%;max-width:200px;flex:none}.ll{width:min(78vw,340px)}
#cf .ttl{text-align:center;margin-bottom:6px}

/* ===== إضافات ===== */
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body{padding-bottom:40px}
.lbl,#ldn.lbl,#mode,#tm,#tm *{color:#000!important}
#tm{font-weight:900}
.lbl{font-weight:700}
#dlg{--d:min(92vw,calc(100vh - 80px),calc(100dvh - 80px),540px)}
#cr{position:fixed;inset:auto 0 0 0;margin:0;width:auto;height:auto;border:0;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:#fff;color:#000;border-top:1px solid var(--line);text-align:center;font:800 12px 'Tajawal',sans-serif;letter-spacing:.4px;pointer-events:none;z-index:2147483647;direction:ltr;overflow:visible}
#cr:not(:popover-open){display:block}
#login{overflow:auto;justify-content:safe center;padding-bottom:50px}
@media (orientation:landscape) and (max-height:620px){
 .wrap{max-width:none;padding:6px 10px}
 header{margin-bottom:4px}
 h1{font-size:20px}
 .hl{width:auto;height:clamp(28px,9vh,44px);max-width:none}
 #tm{min-height:0;margin-bottom:4px;font-size:clamp(13px,4vh,20px)}
 main{grid-template-columns:minmax(80px,1fr) minmax(0,3.4fr) minmax(80px,1fr);grid-template-areas:"b x r";align-items:center;gap:10px}
 .team{aspect-ratio:auto;padding:6px;border-radius:18px;gap:2px}
 .ic{width:clamp(34px,14vh,72px);height:clamp(34px,14vh,72px)}
 .score{font-size:clamp(26px,13vh,64px)}
 .board{width:min(100%,calc((100vh - 118px)*2));gap:clamp(3px,.9vh,7px)}
 .sq{font-size:clamp(10px,3.2vh,16px);border-radius:6px}
 .tools .btn,#cd{height:clamp(30px,9vh,42px)}
 .tools .btn{width:clamp(30px,9vh,42px)}
 #login{flex-direction:row;flex-wrap:wrap;gap:12px 24px;padding:10px 10px 44px}
 #login .ll{width:min(30vw,200px)}
 #login .role{width:104px;padding:10px}.role svg{width:52px;height:52px}
 .lead{max-width:260px;padding:8px}
}

/* بطاقة مستطيلة مرنة */
#dlg{--d:min(94vw,640px);width:var(--d);height:auto;max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px);border-radius:18px}
#dlg .m{font-size:calc(var(--d)/26);font-size:min(calc(var(--d)/24),calc((100dvh - 80px)/17));height:auto;display:block;padding:1em 1.2em}
#dlg .m>:first-child,#dlg .m>:last-child{margin-top:0;margin-bottom:0}
#dlg .tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:.5em}
#dlg .tiles span{width:3.4em}
#dlg .pimg{width:min(100%,9em)}
#dlg .hd{margin-bottom:.6em}

/* نافذة البطاقة: مستطيلة بالعرض في منتصف اللعب */
#dlg{--d:min(84vw,520px);border-radius:22px;box-shadow:0 18px 50px #0007,0 0 0 1px #0001;margin:auto;overflow:hidden}
#dlg .m{display:flex;flex-direction:column;justify-content:center;min-height:calc(var(--d)*.52);max-height:calc(100dvh - 70px);overflow:auto;padding:1em 1.2em}
#dlg[open]{animation:cpop .32s cubic-bezier(.2,1.25,.4,1)}
#dlg[open]::backdrop{animation:cfade .25s ease-out}
dialog::backdrop{background:#0007;backdrop-filter:blur(2px)}
@keyframes cpop{from{opacity:0;transform:scale(.78) translateY(14px)}to{opacity:1;transform:none}}
@keyframes cfade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#dlg[open],#dlg[open]::backdrop{animation:none}}
@media (orientation:landscape) and (max-height:620px){#dlg{--d:min(70vw,520px)}#dlg .m{min-height:0}}

/* ===== نافذة البطاقة: مربعة في المنتصف (نهائي) ===== */
#dlg{--s:min(88vw,calc(100vh - 70px),440px);--d:var(--s);width:var(--s)!important;height:var(--s)!important;min-height:0!important;max-height:none!important;aspect-ratio:1/1;margin:auto!important;padding:0!important;border-radius:22px!important;overflow:hidden!important;outline:none!important;border:0!important}
#dlg:focus,#dlg *:focus{outline:none}
#dlg .m{width:100%;height:100%!important;min-height:0!important;max-height:none!important;box-sizing:border-box;display:flex!important;flex-direction:column;justify-content:center;align-items:stretch;gap:.35em;font-size:max(11px,calc(var(--s)/26))!important;padding:.9em 1em!important;overflow:auto!important}
#dlg .m>*{margin-top:0!important;margin-bottom:0!important;flex:none}
#dlg .hd{margin-bottom:.2em!important}
#dlg .tb{margin:0 .2em!important;padding:.6em .5em!important;font-size:1.3em!important;line-height:1.5}
#dlg .big{font-size:2.8em!important;line-height:1.1}
#dlg .tiles{display:flex!important;flex-wrap:wrap;justify-content:center;gap:.4em!important;margin:0!important}
#dlg .tiles span{width:2.8em!important;height:2.8em!important;font-size:1.9em!important}
#dlg .trio{margin:0!important}
#dlg .pimg{width:min(100%,7.5em)!important;margin:0 auto!important}
#dlg .row{margin-top:.2em!important}
#dlg .act{margin-top:.2em!important}
#dlg .fin{padding:.3em!important}
@media (orientation:landscape) and (max-height:620px){#dlg{--s:min(88vw,calc(100vh - 66px),440px)}}
</style>
</head>
<body>
<div id="login"><img class="lgo ll" alt="OUDI GAMES"><div id="cs" style="display:none"><input id="code" inputmode="numeric" maxlength="4" placeholder="كود اللعبة" style="font:900 28px Tajawal,sans-serif;text-align:center;width:180px;padding:8px;border:2px solid var(--ink);border-radius:12px"><div class="row"><button class="btn p" onclick="setRole(PR,true)">دخول</button><button class="btn ghost" onclick="backRoles()">رجوع</button></div></div><div id="lm" class="msg"></div><div class="roles" id="roles"><div class="lead"><div class="lt">قائد اللعبة</div><div class="row"><button class="btn" id="ln" onclick="setRole('L')"></button><button class="btn" id="lj" onclick="leaderJoin()"></button></div></div>
<button class="role" aria-label="الجمجمة" onclick="setRole('b')"><svg id="lb" viewBox="0 0 64 64" fill="#0a0a0a"></svg></button>
<button class="role" aria-label="البرق" onclick="setRole('r')"><svg id="lr" viewBox="0 0 64 64" fill="#facc15"></svg></button></div></div>
<div class="wrap">
<header><img class="lgo hl" alt="OUDI GAMES"><button class="btn" id="cd" onclick="copyCode()"></button><div class="tools"><button class="btn" id="new" aria-label="جولة جديدة" title="جولة جديدة"></button><button class="btn" id="out" aria-label="خروج" title="خروج"></button></div></header>
<div id="ldn" class="lbl"></div>
<div id="tm"></div>
<main>
<section class="team b" id="tb"><svg class="ic" id="ib" viewBox="0 0 64 64"></svg><div class="score" id="sb">0</div><div class="lbl" id="pb"></div></section>

</main>
</div>
<div id="cr" popover="manual">© جميع الحقوق محفوظة — SOUL GHAZWANI GM</div>

  shuffle(TNG);shuffle(RID);shuffle(MTH);shuffle(LNK);
  const el=$('board');el.innerHTML='';
  for(let n=1;n<=50;n++){const b=document.createElement('button');b.className='sq';b.textContent=n;b.setAttribute('aria-label','المربع '+n);b.onclick=()=>pick(n);el.appendChild(b)}
  S.open=0;S.html='';turn();render();push()
}
function render0(){
  for(const t of['b','r']){
    $('s'+t).textContent=S.score[t];
    $('p'+t).textContent=S.pl[t]?('لاعبون: '+(S.pl[t]>0?'+':'')+S.pl[t]):'';
    const ic=$('i'+t);ic.innerHTML=ICON[t];
    ic.setAttribute('class','ic'+(S.over?'':(S.cur===t?' red':' yel')));
  }
  [...$('board').children].forEach((b,i)=>{const o=S.owner[i+1];b.disabled=!!o;
    b.innerHTML=o?`<svg viewBox="0 0 64 64" fill="${TC[o]}">${ICON[o]}</svg>`:(i+1)});
}
const hd=(n,t,p)=>`<div class="hd"><span class="ttl">${t}</span><span class="st">${p?'⭐ '+p:''}</span><b class="no">${n}</b></div>`;
const box=(t,c,x='')=>`<div class="tb ${x}" style="--c:${c}"><span>${t}</span></div>`;
const rv=(t)=>`<div class="ans" id="ans"></div><div class="row"><button class="btn ghost" onclick="$('ans').textContent='${t}'">إظهار الإجابة</button></div>`;
const one=(t,v,l)=>`<div class="act"><div class="row"><button class="btn p" onclick="act('${t}',${v})">${l}</button></div></div>`;
const okB=(p,f=0)=>`<div class="act"><div class="row"><button class="btn g" onclick="act('pts',${p})">🟩 نجاح +${p}</button><button class="btn r" onclick="act('pts',${f})">🟥 خطأ ${f}</button></div></div>`;
const cntUI=(u,l)=>`<div class="act"><div class="stp"><span>${l}</span><button onclick="step(-1)">−</button><b id="cn">0</b><button onclick="step(1)">+</button></div><div class="row"><button class="btn p" onclick="act('pts',(+$('cn').textContent)*${u})">تأكيد النقاط</button></div></div>`;
function step(d){const e=$('cn');e.textContent=Math.max(0,+e.textContent+d)}
function body(n,k){
  const c=S.cur,o=other(c),H=(t,p)=>hd(n,t,p);
  switch(k){
  case 'pic':{const m=PICS[S.pi[n]];
    return H('خمّن الشكل','+30')+`<img class="pimg" id="pimg" alt="ظل مطموس" src="${m.s}"><div>ما هذا الشكل؟</div><div class="ans" id="ans"></div><div class="row"><button class="btn ghost" onclick="$('pimg').src='${m.o}';$('ans').textContent='${m.n}'">إظهار الصورة</button></div>`+okB(30)}
  case 'let':{const v=shuffle(['ا','و','ي']).slice(0,2),L=shuffle([...v,...shuffle(LET.filter(x=>!v.includes(x))).slice(0,4)]);
    return H('تحدي الحروف','+10 للكلمة')+`<div class="tiles">${L.map(x=>`<span>${x}</span>`).join('')}</div><div>اكتشف الكلمات، لكل كلمة 10 نقاط</div>`+cntUI(10,'عدد الكلمات')}
  case 'dice':return H('النرد','+10 للستة')+`<div class="big">🎲🎲</div><div>يقوم الفريق كله بلعب النرد مرة واحدة، لكل ستة يحتسب له 10 نقاط</div>`+cntUI(10,'عدد الستات');
  case 'tng':{const t=TNG[S.u.tng++%2];return H('اللسان السريع','+20')+box(t[0],t[1])+`<div>ردد العبارة خمس مرات</div>`+okB(20)}
  case 'rid':{const t=RID[S.u.rid++%3];return H('اكتشف الحل','+20')+box(t[0],t[2])+rv(t[1])+okB(20)}
  case 'mth':{const t=MTH[S.u.mth++%2];return H('اكتشف الحل','+20')+box(t[0],t[2])+rv(t[1])+okB(20)}
  case 'rev':return H('العبارة المقلوبة','+30')+box('جبل بيت جمال جميل','#7c3aed','mir')+`<div>اقرأ العبارة المقلوبة</div>`+okB(30);
  case 'lnk':{const t=LNK[S.u.lnk++%4];return H('اكتشف الرابط','+30')+`<div class="trio">${[...t[0].matchAll(/\P{M}\uFE0F?/gu)].slice(0,3).map(x=>`<span>${x[0]}</span>`).join('')}</div><div>اكتشف الرابط بين الصور</div>`+rv(t[1])+okB(30)}
  case 'lucky':return H('رقم الحظ','+30')+box('رقم الحظ: 100','#2e0442')+`<div>العب ضد الخصم رقم الحظ 100 يمنح فريقك +30 نقطة، لكن لو ظهر الرقم للخصم تخسرها!</div>`+okB(30,-30);
  case 'add':return H('نقاط مجانية','+30')+`<div class="big">⭐</div><div>ياوحش اكتسبت نقاط بدون جهد جهيد</div>`+one('pts',30,'خذ النقاط');
  case 'sub':return H('خسارة','-15')+`<div class="big">😬</div><div>خسرت 15 نقطة</div>`+one('pts',-15,'حسناً');
  case 'joker':return H('الجوكر','-20')+`<div class="big">🃏</div><div>الجوكر ضحك عليك وأخذ 20 نقطة</div>`+one('pts',-20,'حسناً');
  case 'steal':return H('سارق النقاط','+15')+`<div class="big">🥷</div><div>يسرق من نقاط الخصم ويضاف لفريقه</div>`+one('steal',15,'اسرق 15 نقطة');
  case 'give':return H('مقلب الوداع','-15')+`<div class="big">👋</div><div>حان وقت الوداع! انتقل إلى الفريق الخصم وخُذ 15 نقطة هدية ترحيبية لهم</div>`+one('give',15,'حسناً');
  case 'st':return H('متجر النجوم','-50')+`<div class="big">⭐</div><div>اشترِ لاعباً من الفريق الآخر بـ 50 نقطة من رصيدك</div><div class="msg" id="msg"></div><div class="row"><button class="btn p" onclick="buy()">اشترِ</button><button class="btn ghost" onclick="act('pts',0)">تخطَّ</button></div>`;
  default:return H('حظك متعثر','')+`<div class="big">⏳</div><div>حظك متعثر في هذه الجولة، راحت عليك انتظر الجولة القادمة!</div>`+one('skip',0,'حسناً')}
}
function pick(n,f){if(S.owner[n]||S.open||S.over||!(f||canPick()))return;S.owner[n]=S.cur;S.cnt++;S.open=n;S.html=body(n,S.kinds[n-1]);render();push()}
function buy(){if(!isL())return;const c=S.cur,o=other(c);
  if(S.score[c]>=50){S.score[c]-=50;S.pl[c]++;S.pl[o]--;next()}else $('msg').textContent='رصيدك أقل من 50 نقطة'}
function act(t,v){if(!isL())return;const c=S.cur,o=other(c);
  if(t==='pts')S.score[c]+=v;else if(t==='skip')S.skip[c]=true;
  else if(t==='steal'){const n=Math.min(v,S.score[o]);S.score[o]-=n;S.score[c]+=n}
  else if(t==='give'){S.score[c]-=v;S.score[o]+=v}
  next()}
function next(){S.open=0;S.html='';
  if(S.cnt>=50){end();return}
  let t=other(S.cur);if(S.skip[t]){S.skip[t]=false;t=S.cur}
  S.cur=t;turn();render();push()}
function end(){S.over=true;S.open=0;const{b,r}=S.score;
  const w=b===r?'تعادل!':(b>r?'فاز فريق الجمجمة':'فاز فريق البرق');
  S.html=`<div class="fin"><div class="big">🏆 ${w}</div><p>الجمجمة ${b} — البرق ${r}</p><div class="row"><button class="btn" onclick="$('dlg').close();newGame()">${I_REF}جولة جديدة</button></div></div>`;
  render();push()}
$('new').onclick=()=>{if(!isL())return;if(S.cnt===0)newGame();else ask('بدء جولة جديدة؟',newGame)};
$('dlg').addEventListener('cancel',e=>e.preventDefault());
let ROLE=null,SYNC=false,ref=null,lastTk=0,DL=0,lastH='';
const isL=()=>!SYNC||ROLE==='L',canPick=()=>!SYNC||ROLE===S.cur;
function turn(){S.tk=Date.now();lastTk=S.tk;DL=Date.now()+10000}
let PQ=Promise.resolve();
function push(){if(!ref)return;const j=JSON.stringify(S),r=ref;PQ=PQ.then(()=>r.set({s:j})).catch(()=>{})}
function render(){render0();
  const sh=!!(S.open||S.over);
  if(sh){if(S.html!==lastH){lastH=S.html;$('mc').innerHTML=S.html}if(!$('dlg').open)$('dlg').showModal()}
  else{lastH='';if($('dlg').open)$('dlg').close()}
  $('dlg').classList.toggle('nl',!isL());
  ['b','r'].forEach(t=>$('t'+t).classList.toggle('me',SYNC&&ROLE===t));
  $('new').style.display=isL()?'':'none';$('out').style.display='';$('cd').style.display=ROLE==='L'?'':'none';tickUI()}
function tickUI(){const e=$('tm');if(S.over||S.open){e.textContent='';return}
  if(SYNC&&(ROLE==='b'||ROLE==='r')){
    e.innerHTML=S.cur===ROLE?'دور فريقك — اختر رقمك':'دور فريق '+lg(S.cur)+' — انتظر دورك';return}
  e.innerHTML='دور فريق '+lg(S.cur)+(SYNC&&ROLE==='L'?' | أنت: القائد':'')}
let DB=null,unsub=null,CODE='',PR=null;
function backRoles(){$('cs').style.display='none';$('roles').style.display='flex';$('lm').textContent=''}
function copyCode(){const b=$('cd');const ok=()=>{b.innerHTML=I_CK+'تم النسخ';setTimeout(()=>b.innerHTML=I_CP+'الكود: '+CODE,1200)};
  const fb=()=>{const t=document.createElement('textarea');t.value=CODE;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(e){}t.remove();ok()};
  try{navigator.clipboard.writeText(CODE).then(ok,fb)}catch(e){fb()}}
// حدود الاتصال: قائدان كحد أقصى، و5 لاعبين لكل فريق
const MAXN={L:2,b:5,r:5},UID=Math.random().toString(36).slice(2);
let SLOT=0,HB=null;
const sref=(c,r,n)=>DB.doc('oudi/g'+c+'_'+r+n);
const fresh=d=>!!d&&Date.now()-(+d.t||0)<15000;
async function claim(c,r){
  for(let n=1;n<=MAXN[r];n++){
    let ok=true;
    try{const s=await sref(c,r,n).get();if(s.exists&&fresh(s.data())&&s.data().u!==UID)ok=false}catch(e){}
    if(!ok)continue;
    try{await sref(c,r,n).set({t:Date.now(),u:UID});const v=await sref(c,r,n).get();if(v.exists&&v.data().u===UID)return n}catch(e){}
  }
  return 0}
async function countL(c){let k=0;for(let n=1;n<=2;n++){try{const s=await sref(c,'L',n).get();if(s.exists&&fresh(s.data()))k++}catch(e){}}return k}
async function beat(){
  if(!SYNC||!SLOT)return;
  try{await sref(CODE,ROLE,SLOT).set({t:Date.now(),u:UID})}catch(e){}
  const k=await countL(CODE);if(!SYNC)return;
  $('ldn').textContent=ROLE==='L'?'القادة: '+Math.max(k,1)+' / 2':(k?'':'لا يوجد قائد حالياً، بانتظار قائد')}
function showCode(r){PR=r;$('roles').style.display='none';$('cs').style.display='block';$('lm').textContent='';$('code').focus()}
async function leaderJoin(){await DBP;if(!DB){$('lm').textContent='اللعب المشترك غير متاح';return}showCode('L')}
async function setRole(r,go){
  await DBP;
  if(!DB){ROLE=r;$('login').style.display='none';render();return}
  if(r!=='L'&&!go){showCode(r);return}
  let c=$('code').value.trim(),rf;
  if(r==='L'&&!go){ // كود جديد
    let ok=false;
    for(let i=0;i<15&&!ok;i++){c=String(1000+Math.floor(Math.random()*9000));
      try{const s=await DB.doc('oudi/g'+c).get();let tk=0;
        if(s.exists){try{tk=JSON.parse(s.data().s).tk||0}catch(e){}}
        ok=!s.exists||Date.now()-tk>6*3600*1000}
      catch(e){$('lm').textContent='تعذر الاتصال';return}}
    if(!ok){$('lm').textContent='تعذر إنشاء كود، حاول مرة أخرى';return}
    newGame();rf=DB.doc('oudi/g'+c);
    try{await rf.set({s:JSON.stringify(S)})}catch(e){$('lm').textContent='تعذر الاتصال';return}
  }else{ // كود فعّال (قائد ثانٍ أو لاعب)
    if(!c){$('lm').textContent='اكتب كود اللعبة أولاً';return}
    rf=DB.doc('oudi/g'+c);
    try{const s=await rf.get();if(!s.exists){$('lm').textContent='الكود غير صحيح';return}}
    catch(e){$('lm').textContent='تعذر الاتصال';return}
  }
  const n=await claim(c,r);
  if(!n){$('lm').textContent=r==='L'?'اكتمل عدد القادة: الحد الأقصى قائدان':'الفريق مكتمل: الحد الأقصى 5 لاعبين';return}
  ROLE=r;SLOT=n;ref=rf;SYNC=true;lastH='';$('lm').textContent='';
  CODE=c;$('cd').innerHTML=I_CP+'الكود: '+c;$('login').style.display='none';
  unsub=rf.onSnapshot(sn=>{if(!sn.exists){if(ROLE==='L')push();return}
    let s;try{s=JSON.parse(sn.data().s)}catch(e){return}
    S=s;if(S.tk!==lastTk){lastTk=S.tk;DL=Date.now()+10000}render()},()=>{});
  if(HB)clearInterval(HB);HB=setInterval(beat,5000);beat();
  render()}
function leave(){const c=CODE,r=ROLE,n=SLOT;
  if(HB)clearInterval(HB);HB=null;
  if(DB&&c&&r&&n)sref(c,r,n).set({t:0,u:UID}).catch(()=>{});
  if(unsub)unsub();unsub=null;ref=null;SYNC=false;ROLE=null;SLOT=0;lastH='';
  if($('dlg').open)$('dlg').close();$('cd').innerHTML='';$('ldn').textContent='';$('code').value='';CODE='';
  newGame();backRoles();$('login').style.display='flex'}
$('out').onclick=()=>{const L=ROLE==='L'&&SYNC;
  ask(L?'الخروج من اللعبة؟ يبقى الكود فعّالاً ويمكن لقائد آخر الدخول به وإكمال اللعب.':'الخروج من اللعبة؟ يمكنك العودة بنفس الكود.',leave)};
async function connect(){try{DB=window.claude&&await window.claude.use('db')}catch(e){}
  if(!DB&&!ROLE&&!$('lm').textContent)$('lm').textContent='اللعب المشترك غير متاح'}
$('lb').innerHTML=ICON.b;$('lr').innerHTML=ICON.r;
$('new').innerHTML=I_REF;$('out').innerHTML=I_OUT;
$('ln').innerHTML=I_NEW+'كود جديد';$('lj').innerHTML=I_JOIN+'كود فعال';
document.querySelectorAll('.lgo').forEach(i=>i.src=LOGO);

function keepCR(){const c=$('cr');try{c.hidePopover();c.showPopover()}catch(e){}}
(function(){const o=HTMLDialogElement.prototype.showModal;HTMLDialogElement.prototype.showModal=function(){o.call(this);keepCR()}})();
keepCR();
window.addEventListener('orientationchange',()=>setTimeout(keepCR,300));
newGame();const DBP=connect();
</script>
</body>
